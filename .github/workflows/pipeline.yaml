name: Production CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACR_NAME: mycdentdevmcd26x
  ACR_LOGIN_SERVER: mycdentdevmcd26x.azurecr.io
  IMAGE_NAME: order-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - uses: azure/setup-helm@v4
      - name: Install backend dependencies
        run: python -m pip install -r src/backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q src/backend
      - name: Lint and render Helm chart
        run: |
          helm lint helm/app-chart
          helm template order-backend helm/app-chart --namespace orders > /dev/null

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        name: Sign in to Azure with OIDC
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sbom: true
          provenance: mode=max

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, aks-vnet]
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        name: Sign in to Azure with OIDC
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.22
      - uses: azure/setup-kubectl@v4
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-mycdent-dev-mcd26x
          cluster-name: aks-mycdent-dev-mcd26x
          admin: "false"
          use-kubelogin: "true"
      - name: Apply orders namespace manifest
        run: |
          image="${ACR_LOGIN_SERVER}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          sed -i "s|mycompany-registry.io/apps/order-backend:1.0.0@sha256:<digest>|${image}|" values.yaml
          grep -Fq "image: ${image}" values.yaml
          kubectl apply -f values.yaml
          kubectl rollout status deployment/order-backend --namespace orders --timeout=10m
