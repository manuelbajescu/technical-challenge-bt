name: Production CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_RESOURCE_GROUP: rg-mycdent-dev-mcd26x
  AKS_CLUSTER_NAME: aks-mycdent-dev-mcd26x
  ACR_NAME: mycdentdevmcd26x
  ACR_LOGIN_SERVER: mycdentdevmcd26x.azurecr.io
  IMAGE_NAME: order-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - uses: azure/setup-helm@v4
      - name: Install backend dependencies
        run: python -m pip install -r src/backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q src/backend
      - name: Lint and render Helm chart
        run: |
          helm lint helm/app-chart
          helm template order-backend helm/app-chart --namespace orders > /dev/null

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        name: Sign in to Azure with OIDC
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.22
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: "false"
          use-kubelogin: "true"
      - uses: azure/setup-helm@v4
      - name: Deploy to AKS
        run: |
          helm upgrade --install order-backend helm/app-chart \
            --namespace orders \
            --set-string image.repository="$ACR_LOGIN_SERVER/$IMAGE_NAME" \
            --set-string image.tag="$GITHUB_SHA" \
            --atomic --wait --timeout 10m
